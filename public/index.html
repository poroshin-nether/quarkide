<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"><title>quarkide</title><link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/style.css"><style>html,body{margin:0;padding:0;height:100%}
body{background:#050508;font-family:Consolas,monospace;color:#ccd;overflow:hidden}
#app{display:none}
#splash{position:fixed;inset:0;background:#050508;display:flex;align-items:center;justify-content:center;z-index:6;overflow:hidden}
.boot{display:flex;flex-direction:column;align-items:center;z-index:2;font-family:Consolas,monospace}
.boot-logo{font-size:36px;font-weight:700;letter-spacing:6px;color:#ccd;text-transform:uppercase}
.boot-logo span{color:#007acc;text-shadow:0 0 16px rgba(0,122,204,0.6)}
.boot-sub{font-size:10px;color:rgba(0,122,204,0.45);letter-spacing:4px;text-transform:uppercase;margin-top:6px;margin-bottom:22px}
#login-box{display:none;flex-direction:column;align-items:center;margin-top:22px}
.login-form{display:flex;flex-direction:column;gap:8px;width:280px}
#login-pass{background:rgba(0,0,0,0.25);border:1px solid rgba(0,122,204,0.25);color:#ccd;font:12px Consolas,monospace;padding:10px 12px;letter-spacing:3px;text-align:center;outline:none}
#login-pass::placeholder{color:rgba(255,255,255,0.22);letter-spacing:2px;text-transform:uppercase;font-size:10px}
#login-btn{background:rgba(0,122,204,0.08);border:1px solid rgba(0,122,204,0.35);color:#007acc;font:10px Consolas,monospace;letter-spacing:3px;text-transform:uppercase;padding:10px;cursor:pointer}
#login-btn:hover{background:rgba(0,122,204,0.15)}
#login-error{display:none;margin-top:14px;font-size:10px;color:#c44;letter-spacing:2px;text-transform:uppercase}
</style></head><body><div id="splash"><div class="boot"><div class="boot-logo">quarkid<span>e</span></div><div class="boot-sub">system boot</div><div id="login-box"><div class="login-form"><input id="login-pass" type="password" placeholder="access code"><button id="login-btn">authorize</button></div><div id="login-error">access denied</div></div></div></div><div id="app"><div id="app-body"><div id="sidebar"><div id="sidebar-header"><select class="ui-control ui-select" id="drive-select" style="display:none"></select><span class="path" id="current-path"></span><button class="ui-ghost" id="sidebar-toggle" title="Hide explorer">&#9776;</button></div><div id="tree"></div></div><div id="v-resizer"></div><div id="main"><div id="content"><div id="editor-wrap"><div id="tabs"><button class="ui-ghost" id="sidebar-open" title="Show explorer">&#9776;</button></div><div id="no-file"></div><div id="editor"></div></div><div id="h-resizer"></div><div id="terminal-wrap"><div id="term-tabs"></div><div id="terminal"></div></div></div></div></div><div id="status"><span id="status-file"></span><span id="status-pos"></span><span style="flex:1"></span><span class="mini-bar"><button class="ui-status-btn toggle" id="mini-minimap" title="Code map">map</button><button class="ui-status-btn toggle" id="mini-column-select" title="Box select">box</button></span><button class="ui-status-btn" id="save-btn">save</button><button class="ui-status-btn" id="term-ctrlc-btn" title="Send Ctrl+C to terminal">^C</button><button class="ui-status-btn" id="term-btn" title="New terminal">terminal</button><button class="ui-status-btn" id="settings-btn" title="Settings">settings</button><button class="ui-status-btn" id="logout" title="Logout">logout</button></div></div><div id="settings-overlay"></div><div id="settings-popup"><div class="popup-inner"><div class="settings-popup-header"><span>settings</span><button class="ui-close lg" id="settings-close">&times;</button></div><div class="settings-group"><div class="ui-label">font</div><div class="font-settings"><select class="ui-control ui-select" id="font-select"><option value="Consolas">Consolas</option><option value="JetBrains Mono">JetBrains Mono</option><option value="Fira Code">Fira Code</option><option value="Cascadia Code">Cascadia Code</option><option value="IBM Plex Mono">IBM Plex Mono</option><option value="Source Code Pro">Source Code Pro</option><option value="Iosevka">Iosevka</option><option value="Geist Mono">Geist Mono</option><option value="Commit Mono">Commit Mono</option><option value="Monaspace Neon">Monaspace Neon</option><option value="Intel One Mono">Intel One Mono</option></select><div class="font-size-group"><button class="ui-control ui-btn square" id="font-size-down">&minus;</button><span id="font-size-value">14</span><button class="ui-control ui-btn square" id="font-size-up">+</button></div></div></div><div class="settings-group"><div class="ui-label">theme</div><div class="font-settings"><select class="ui-control ui-select" id="theme-select"></select></div></div><div class="settings-group"><div class="ui-label">editor</div><div class="editor-settings"><button class="ui-control ui-btn active" id="btn-minimap">Code map</button><button class="ui-control ui-btn" id="btn-column-select">Box select</button><div class="layout-group"><button class="ui-control ui-btn icon active" id="layout-bottom" title="Terminal bottom"><span class="layout-icon layout-icon-bottom"></span></button><button class="ui-control ui-btn icon" id="layout-right" title="Terminal right"><span class="layout-icon layout-icon-right"></span></button></div></div></div></div></div><div id="context-menu"></div><script src="/common.js"></script><script src="/xterm.js"></script><script src="/xterm-addon-fit.js"></script><script src="/settings.js"></script><script src="/terminal.js"></script><script src="/editor.js"></script><script src="/auth.js"></script><script src="/context-menu.js"></script><script src="/app.js"></script><script>tryResume();</script></body></html>
